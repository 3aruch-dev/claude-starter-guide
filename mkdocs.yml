site_name: The Claude Code Starter Guide
site_description: From zero to using AI better than 99% of your peers — for Mac and Windows
site_url: https://3aruch-dev.github.io/claude-starter-guide/
repo_url: https://github.com/3aruch-dev/claude-starter-guide
repo_name: claude-starter-guide
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Follow the reader's system setting, with a toggle for light and dark.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Follow system setting
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - "Part 0: Key words": part-0-key-words.md
  - "Part 1: Foundations": part-1-foundations.md
  - "Part 2: Install Claude Code": part-2-claude-code.md
  - "Part 3: Work like the top 1%": part-3-work-like-the-top-1.md
  - "Part 4: Extend Claude Code": part-4-extend-claude-code.md
  - "Part 5: The wider AI toolkit": part-5-wider-ai-toolkit.md
  - "Part 6: The Living Toolkit": part-6-living-toolkit.md
  - "Part 7: First-week checklist": part-7-first-week-checklist.md
  - "Part 8: Getting unstuck": part-8-getting-unstuck.md
