<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" role="img">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2420"/>
      <stop offset="1" stop-color="#1a1613"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f08a5d"/>
      <stop offset="1" stop-color="#c2522d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9774c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e9774c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="300" cy="210" r="210" fill="url(#glow)"/>
  <!-- back window (Windows PowerShell) -->
  <g transform="translate(150 30) rotate(4)">
    <rect width="330" height="210" rx="16" fill="#1f2433" stroke="#3a4157"/>
    <rect width="330" height="34" rx="16" fill="#2a3045"/>
    <rect y="18" width="330" height="16" fill="#2a3045"/>
    <rect x="16" y="12" width="70" height="10" rx="5" fill="#4a5372"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#9fb0d8">
      <text x="18" y="66">PS C:\&gt; winget install</text>
      <text x="18" y="90" fill="#6f7a99">Found Git [Git.Git]</text>
      <text x="18" y="114" fill="#6f7a99">Successfully installed</text>
    </g>
  </g>
  <!-- front window (Mac Terminal running Claude Code) -->
  <g transform="translate(30 120)">
    <rect width="400" height="270" rx="18" fill="url(#win)" stroke="#4a3f37"/>
    <rect width="400" height="38" rx="18" fill="#332b26"/>
    <rect y="20" width="400" height="18" fill="#332b26"/>
    <circle cx="24" cy="19" r="6.5" fill="#ff5f57"/>
    <circle cx="44" cy="19" r="6.5" fill="#febc2e"/>
    <circle cx="64" cy="19" r="6.5" fill="#28c840"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <text x="22" y="76" fill="#f3e9e2"><tspan fill="#f08a5d">~/projects</tspan> $ claude</text>
      <rect x="22" y="94" width="356" height="62" rx="10" fill="none" stroke="url(#acc)" stroke-width="1.5"/>
      <text x="38" y="120" fill="#f08a5d">✻ Welcome to Claude Code</text>
      <text x="38" y="142" fill="#a8998e">/help for help</text>
      <text x="22" y="190" fill="#f3e9e2">&gt; Build me a budget tracker</text>
      <text x="22" y="216" fill="#a8998e">● Planning… 3 steps</text>
      <rect x="22" y="232" width="10" height="18" rx="2" fill="#f08a5d"/>
    </g>
  </g>
  <!-- sparkle badge -->
  <g transform="translate(410 330)">
    <circle r="34" fill="url(#acc)"/>
    <path d="M0-17 L4-4 17 0 4 4 0 17-4 4-17 0-4-4Z" fill="#fff"/>
  </g>
</svg>
