name: Build check

# Builds the site for every pull request into main, so a broken change is
# caught before it is merged. The build also fails if any link between pages
# is broken. (Pull requests opened by the weekly update job are checked by a
# step in weekly-update.yml instead, because GitHub does not run workflows on
# pull requests opened by github-actions[bot].)
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (fails on errors or broken links)
        run: npm run build
