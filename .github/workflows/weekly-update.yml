name: Weekly guide update

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch: # Also runnable by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write
  statuses: write # only used to post the "Site builds" check on the pull request

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          # Lets the gh tool open the pull request.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use this workflow's own token (with the permissions above)
          # instead of the Claude GitHub App.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Audit every install command, package name, slash command,
            tool and link in src/content/docs/ against the official sources listed in the Living Toolkit
            page and current web results. Fix anything deprecated, renamed or broken. Refresh
            the Living Toolkit recommendations. Update the 'Last reviewed' date. Open ONE pull
            request titled 'Weekly guide update <date>' listing every change and its source.
            If nothing changed, open no pull request.
          claude_args: >-
            --allowedTools "WebSearch,WebFetch,Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh:*),Bash(date:*)"

      # GitHub doesn't run other workflows on pull requests opened by this job,
      # so build the weekly pull request here and attach the result to it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check that the weekly pull request builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh pr list --state open --author "app/github-actions" \
                 --search "Weekly guide update in:title" \
                 --json number,headRefName,headRefOid --limit 1 --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "No weekly pull request is open, so there is nothing to check."
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          branch=$(jq -r .headRefName <<<"$pr")
          sha=$(jq -r .headRefOid <<<"$pr")
          echo "Checking pull request #$number ($branch)"

          git fetch origin "$branch"
          git checkout --force --detach "$sha"
          npm ci

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if npm run build; then
            state=success; desc="The site builds with no errors"
          else
            state=failure; desc="The site does not build - see the run log"
          fi
          gh api "repos/${{ github.repository }}/statuses/$sha" \
            -f state="$state" -f context="Site builds" \
            -f description="$desc" -f target_url="$run_url"
          [ "$state" = success ]
